[project]
name = "readybid-core"
version = "0.1.0"
description = "Shared processing code used by the ReadyBid API and worker."
requires-python = ">=3.13"
dependencies = [
  "groq==1.7.0",
  "httpx==0.28.1",
  "pydantic-settings==2.16.2",
  "pypdf==6.21.3",
  "pyjwt[crypto]==2.15.1",
  "redis==8.1.0",
  "rq==2.12.0",
  "supabase==2.33.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
