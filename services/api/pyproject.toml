[project]
name = "readybid-api"
version = "0.1.0"
description = "ReadyBid SA HTTP API (FastAPI)."
requires-python = ">=3.13"
dependencies = [
  "readybid-core",
  "fastapi==0.162.0",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[tool.uv.sources]
readybid-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
